<footer class="bg-gray-900" aria-labelledby="footer-heading">
  <h2 id="footer-heading" class="sr-only">Footer</h2>
  <div class="mx-auto max-w-7xl px-6 pb-8">
    <div class="mt-8 border-t border-white/10 pt-8 md:flex md:items-center md:justify-between">
      <p class="mt-8 text-sm leading-5 text-gray-400 md:order-1 md:mt-0">
        &copy; {{ now | format:Y }} {{ site:name }}, Inc. All rights reserved.
      </p>
      <button
        type="button"
        x-data
        @click="$dispatch('open-cookie-settings')"
        class="text-sm leading-5 text-gray-400 underline hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 md:order-2"
      >
        Cookie settings
      </button>
    </div>
  </div>
</footer>
